name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: python -m pytest
      - run: |
          export DP_DATABASE_URL=sqlite:///./ci_smoke.db
          alembic upgrade head
          python - <<'PY'
          from src.shared.db import check_db_connection
          assert check_db_connection()
          print("database smoke: ok")
          PY
      - run: python -m src.cli --help
      - run: python -m src.cli parse --help
      - run: python -m src.cli maintenance --help
      - run: python -m src.cli scheduler --help
      - run: python -m src.cli bot --help
