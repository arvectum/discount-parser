name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: test (ubuntu-latest, py3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Tests
        run: python -m pytest

      - name: Database migration and doctor smoke
        env:
          DP_DATABASE_URL: sqlite:///./ci_smoke.db
        run: |
          alembic upgrade head
          python -c "from src.shared.db import check_db_connection; assert check_db_connection(); print('database smoke: ok')"
          python -m src.cli doctor

      - name: CLI smoke
        run: |
          python -m src.cli --help
          python -m src.cli parse --help
          python -m src.cli maintenance --help
          python -m src.cli scheduler --help
          python -m src.cli bot --help
          python -m src.cli run --help
          python -m src.cli web --help
          python -m src.cli doctor --help
          python -m src.cli smoke-report --help

  test-cross-platform:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: test (${{ matrix.os }}, py3.11)
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Tests
        run: python -m pytest

      - name: Database migration and doctor smoke
        env:
          DP_DATABASE_URL: sqlite:///./ci_smoke.db
        run: |
          alembic upgrade head
          python -c "from src.shared.db import check_db_connection; assert check_db_connection(); print('database smoke: ok')"
          python -m src.cli doctor

      - name: CLI smoke
        run: |
          python -m src.cli --help
          python -m src.cli parse --help
          python -m src.cli maintenance --help
          python -m src.cli scheduler --help
          python -m src.cli bot --help
          python -m src.cli run --help
          python -m src.cli web --help
          python -m src.cli doctor --help
          python -m src.cli smoke-report --help
