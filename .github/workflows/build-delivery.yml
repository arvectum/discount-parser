name: build-delivery

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: discount-parser-windows
          - os: macos-latest
            artifact: discount-parser-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build frozen application
        run: >-
          pyinstaller --noconfirm --clean --onedir
          --name DiscountParser
          --hidden-import src.web.app
          --collect-all uvicorn
          --collect-all python_calamine
          src/distribution_entry.py

      - name: Stage Windows delivery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force delivery\app | Out-Null
          Copy-Item dist\DiscountParser\* delivery\app -Recurse -Force
          Copy-Item config delivery\app\config -Recurse -Force
          Copy-Item migrations delivery\app\migrations -Recurse -Force
          Copy-Item alembic.ini delivery\app\alembic.ini -Force
          Copy-Item .env.example delivery\app\.env.example -Force
          Copy-Item packaging\windows\install.bat delivery\install.bat -Force

      - name: Stage macOS delivery
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p delivery/app
          cp -R dist/DiscountParser/. delivery/app/
          cp -R config delivery/app/config
          cp -R migrations delivery/app/migrations
          cp alembic.ini delivery/app/alembic.ini
          cp .env.example delivery/app/.env.example
          cp packaging/macos/install.command delivery/install.command
          chmod +x delivery/install.command delivery/app/DiscountParser

      - name: Frozen migration smoke Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: delivery/app
        run: .\DiscountParser.exe migrate

      - name: Frozen migration smoke macOS
        if: runner.os == 'macOS'
        shell: bash
        working-directory: delivery/app
        run: ./DiscountParser migrate

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: delivery
          if-no-files-found: error
