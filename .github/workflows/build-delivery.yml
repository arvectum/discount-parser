name: build-delivery

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

concurrency:
  group: build-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: discount-parser-windows-x64
          - os: macos-latest
            artifact: discount-parser-macos-arm64
          - os: macos-15-intel
            artifact: discount-parser-macos-intel
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build Windows UI executable
        if: runner.os == 'Windows'
        run: >-
          pyinstaller --noconfirm --clean --onedir --noconsole
          --distpath dist-ui
          --workpath build-ui
          --name DiscountParser
          --hidden-import src.web.app
          --hidden-import src.web.application
          --hidden-import src.web.management_pages
          --hidden-import src.web.system_routes
          --hidden-import src.web.onboarding_routes
          --hidden-import src.web.source_registry_routes
          --hidden-import src.web.source_registry_static_routes
          --collect-submodules src.modules.source_registry
          --collect-all uvicorn
          --collect-all python_calamine
          src/distribution_entry.py

      - name: Build Windows worker executable
        if: runner.os == 'Windows'
        run: >-
          pyinstaller --noconfirm --clean --onefile --console
          --distpath dist-worker
          --workpath build-worker
          --name DiscountParserWorker
          --collect-submodules src.modules.source_registry
          --collect-all python_calamine
          src/worker_entry.py

      - name: Build frozen application macOS
        if: runner.os == 'macOS'
        run: >-
          pyinstaller --noconfirm --clean --onedir
          --name DiscountParser
          --hidden-import src.web.app
          --hidden-import src.web.application
          --hidden-import src.web.management_pages
          --hidden-import src.web.system_routes
          --hidden-import src.web.onboarding_routes
          --hidden-import src.web.source_registry_routes
          --hidden-import src.web.source_registry_static_routes
          --collect-submodules src.modules.source_registry
          --collect-all uvicorn
          --collect-all python_calamine
          src/distribution_entry.py

      - name: Stage Windows delivery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force delivery\app | Out-Null
          Copy-Item dist-ui\DiscountParser\* delivery\app -Recurse -Force
          Copy-Item dist-worker\DiscountParserWorker.exe delivery\app\DiscountParserWorker.exe -Force
          Copy-Item config delivery\app\config -Recurse -Force
          Copy-Item migrations delivery\app\migrations -Recurse -Force
          Copy-Item alembic.ini delivery\app\alembic.ini -Force
          Copy-Item .env.example delivery\app\.env.example -Force
          Copy-Item packaging\windows\install.bat delivery\install.bat -Force

      - name: Stage macOS delivery
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p delivery/app
          cp -R dist/DiscountParser/. delivery/app/
          cp -R config delivery/app/config
          cp -R migrations delivery/app/migrations
          cp alembic.ini delivery/app/alembic.ini
          cp .env.example delivery/app/.env.example
          cp packaging/macos/install.command delivery/install.command
          chmod +x delivery/install.command delivery/app/DiscountParser packaging/macos/build_dmg.sh

      - name: Frozen smoke Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: delivery/app
        run: |
          .\DiscountParserWorker.exe migrate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\DiscountParserWorker.exe doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # This DB exists only to prove frozen migrations work. Never package
          # it into Setup.exe: the installed application keeps the customer's
          # persistent database in the same runtime directory.
          Remove-Item .\discount_parser.db, .\discount_parser.db-wal, .\discount_parser.db-shm -Force -ErrorAction SilentlyContinue
          if (Test-Path .\discount_parser.db) { throw "Smoke database must not be packaged" }

      - name: Frozen smoke macOS
        if: runner.os == 'macOS'
        shell: bash
        working-directory: delivery/app
        run: |
          ./DiscountParser migrate
          ./DiscountParser doctor

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash packaging/macos/build_dmg.sh
          test -f "delivery/DiscountParser.dmg"
          test -x "delivery/Discount Parser.app/Contents/MacOS/DiscountParserLauncher"

      - name: Build native Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\installer.iss"
          Copy-Item "packaging\windows\output\DiscountParser-Setup.exe" "delivery\DiscountParser-Setup.exe" -Force

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: delivery
          if-no-files-found: error

  release:
    name: immutable release provenance
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout tagged source with canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate canonical release tag and ancestry
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          release_commit="$(git rev-list -n 1 "$TAG")"
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag target $release_commit does not equal workflow SHA $GITHUB_SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release commit must be reachable from canonical origin/main" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace or mutate it" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

      - name: Download exact build outputs
        uses: actions/download-artifact@v4
        with:
          pattern: discount-parser-*
          path: release-input

      - name: Package artifacts and generate provenance manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in release-input/discount-parser-*; do
            test -d "$dir"
            name="$(basename "$dir")"
            (cd "$dir" && zip -q -r "$GITHUB_WORKSPACE/release/${name}.zip" .)
          done
          (
            cd release
            sha256sum discount-parser-*.zip | sort -k2 > SHA256SUMS
          )
          python scripts/release_provenance.py \
            --artifact-dir release \
            --tag "$TAG" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --server-url "$GITHUB_SERVER_URL" \
            --output release/release-provenance.json
          cat > release/RELEASE_NOTES.md <<EOF
          Automated Discount Parser release $TAG.

          Source commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Verify file digests with SHA256SUMS and GitHub artifact attestations before installation.
          EOF

      - name: Validate manifest against release payload
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_provenance.py \
            --verify release/release-provenance.json \
            --artifact-dir release
          sha256sum -c release/SHA256SUMS

      - name: Attest release payload
        uses: actions/attest@v4
        with:
          subject-path: |
            release/discount-parser-*.zip
            release/SHA256SUMS
            release/release-provenance.json

      - name: Create complete draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Discount Parser $TAG" \
            --notes-file release/RELEASE_NOTES.md \
            release/discount-parser-*.zip \
            release/SHA256SUMS \
            release/release-provenance.json

      - name: Publish release atomically after all assets are attached
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Verify published release binds tag, commit and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          for asset in release/discount-parser-*.zip release/SHA256SUMS release/release-provenance.json; do
            name="$(basename "$asset")"
            jq -e --arg name "$name" '.assets[] | select(.name == $name)' <<<"$release_json" >/dev/null
          done
