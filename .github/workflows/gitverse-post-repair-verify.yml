name: GitVerse mirror health

on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'

permissions:
  contents: read

env:
  GITVERSE_ORG: arvectum
  GITVERSE_REPOSITORY: discount-parser-github-mirror

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify canonical GitHub refs are mirrored
        shell: bash
        run: |
          set -euo pipefail
          remote="https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/${GITVERSE_ORG}/${GITVERSE_REPOSITORY}.git"

          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" canonical.git
          git --git-dir=canonical.git for-each-ref \
            --format='%(objectname) %(refname)' refs/heads refs/tags | sort > canonical.txt
          git ls-remote --refs "$remote" 'refs/heads/*' 'refs/tags/*' \
            | awk '{print $1 " " $2}' | sort > mirror.txt

          comm -23 canonical.txt mirror.txt > missing.txt
          missing_count="$(wc -l < missing.txt | tr -d ' ')"
          github_main="$(git --git-dir=canonical.git rev-parse refs/heads/main)"
          gitverse_main="$(awk '$2 == "refs/heads/main" {print $1}' mirror.txt)"

          {
            echo '### GitVerse mirror health'
            echo "- Canonical GitHub main: \`${github_main}\`"
            echo "- GitVerse mirror main: \`${gitverse_main:-MISSING}\`"
            echo "- Target: \`${GITVERSE_ORG}/${GITVERSE_REPOSITORY}\`"
            echo "- Missing/mismatched canonical refs: \`${missing_count}\`"
            echo '- Policy: no force, no prune, no deletion'
          } >> "$GITHUB_STEP_SUMMARY"

          if test "$gitverse_main" != "$github_main" || test "$missing_count" != 0; then
            cat missing.txt
            exit 1
          fi
