name: GitVerse final mirror acceptance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mirror-to-gitverse.yml'
      - '.github/workflows/gitverse-post-repair-verify.yml'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITVERSE_ORG: arvectum
      GITVERSE_REPOSITORY: discount-parser-github-mirror
      GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for automatic mirror and verify canonical refs
        shell: bash
        run: |
          set -euo pipefail
          remote="https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/${GITVERSE_ORG}/${GITVERSE_REPOSITORY}.git"
          remote_main=""

          # The mirror workflow runs independently on the same push. Give it a
          # bounded window to finish, then require exact main equality.
          for attempt in $(seq 1 18); do
            remote_main="$(git ls-remote "$remote" refs/heads/main | awk '{print $1}')"
            if test "$remote_main" = "$GITHUB_SHA"; then
              break
            fi
            test "$attempt" != "18" || break
            sleep 5
          done

          result=PASS
          test "$remote_main" = "$GITHUB_SHA" || result=FAIL

          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" canonical.git

          missing_or_mismatched=0
          while read -r sha ref; do
            remote_sha="$(git ls-remote "$remote" "$ref" | awk '{print $1}')"
            if test "$remote_sha" != "$sha"; then
              echo "Mismatch: $ref GitHub=$sha GitVerse=${remote_sha:-MISSING}"
              missing_or_mismatched=$((missing_or_mismatched + 1))
            fi
          done < <(git --git-dir=canonical.git for-each-ref \
            --format='%(objectname) %(refname)' refs/heads refs/tags)

          test "$missing_or_mismatched" = 0 || result=FAIL

          cat > report.md <<EOF
          DP-REPO-003 automatic mirror acceptance: **${result}**

          - canonical GitHub main: \`${GITHUB_SHA}\`
          - GitVerse mirror main: \`${remote_main:-MISSING}\`
          - target: \`${GITVERSE_ORG}/${GITVERSE_REPOSITORY}\`
          - all canonical GitHub branches/tags present at identical SHAs: $([ "$missing_or_mismatched" = 0 ] && echo YES || echo NO)
          - force/prune/delete used by verifier: NO / NO / NO

          This verifier is read-only against GitVerse and validates the normal automatic mirror workflow, not the bootstrap workflow.
          EOF

          gh issue comment 34 --repo "$GITHUB_REPOSITORY" --body-file report.md
          test "$result" = PASS
