name: Report GitVerse repair

on:
  workflow_run:
    workflows:
      - 'One-time GitVerse mirror repair'
    types:
      - completed

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Capture sanitized failed log and report to issue 34
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > raw.log 2>&1 || true
          sed -E \
            -e 's#https://arvectum:[^@[:space:]]+@gitverse\.ru#https://arvectum:***@gitverse.ru#g' \
            -e '/Authorization:/d' \
            -e '/GITVERSE_TOKEN/d' \
            raw.log | tail -n 120 > sanitized.log

          {
            echo "DP-REPO-003 repair workflow diagnostic"
            echo
            echo "- conclusion: \`$CONCLUSION\`"
            echo "- run id: \`$RUN_ID\`"
            echo "- run: $RUN_URL"
            echo
            echo 'Sanitized failed-step log:'
            echo '```text'
            cat sanitized.log
            echo '```'
          } > report.md

          gh issue comment 34 --repo "$GITHUB_REPOSITORY" --body-file report.md
