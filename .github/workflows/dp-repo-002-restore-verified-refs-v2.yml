name: DP-REPO-002 Restore Verified Refs v2

on:
  push:
    branches:
      - recovery/dp-repo-002-import

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Restore independently verified tags with HTTP-status checks
        shell: bash
        run: |
          set -euo pipefail

          restore_tag() {
            local name="$1"
            local sha="$2"
            local api="https://api.github.com/repos/${GH_REPO}/git/ref/tags/${name}"
            local body status existing
            body="$(mktemp)"
            status="$(curl -sS -o "$body" -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"

            if [ "$status" = "200" ]; then
              existing="$(jq -r '.object.sha' "$body")"
              if [ "$existing" != "$sha" ]; then
                echo "::error::Tag ${name} exists at ${existing}, expected ${sha}; refusing to move it"
                exit 1
              fi
              echo "TAG_PRESENT|${name}|${sha}"
              return
            fi
            if [ "$status" != "404" ]; then
              echo "::error::Unexpected lookup status ${status} for ${name}"
              cat "$body"
              exit 1
            fi

            payload="$(jq -nc --arg ref "refs/tags/${name}" --arg sha "$sha" '{ref:$ref,sha:$sha}')"
            create_body="$(mktemp)"
            create_status="$(curl -sS -o "$create_body" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "https://api.github.com/repos/${GH_REPO}/git/refs")"
            if [ "$create_status" != "201" ]; then
              echo "::error::Failed to create ${name}: HTTP ${create_status}"
              cat "$create_body"
              exit 1
            fi
            existing="$(jq -r '.object.sha' "$create_body")"
            test "$existing" = "$sha"
            echo "TAG_RESTORED|${name}|${sha}"
          }

          restore_tag discount-parser-telegram-hotfix-2026-08-15 770d8d3fc11b734909a512841851ef6b25ae7d63
          restore_tag discount-parser-windows-recovery-hotfix-2026-08-16 b6ba4e0808d640e938bdd53eb1cf87b2416cca10
          echo 'VERIFIED_TAG_RESTORE=PASS'
