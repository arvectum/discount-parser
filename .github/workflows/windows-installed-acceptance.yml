name: Windows installed acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-installed-acceptance.yml"
      - "packaging/windows/**"
      - "requirements/windows-build.lock"
      - "scripts/build_windows_ci.ps1"
      - "scripts/ensure_inno_setup.ps1"
      - "scripts/windows_build_provenance.py"
      - "scripts/windows_installed_acceptance.ps1"
      - "src/**"
      - "config/**"
      - "migrations/**"
      - "alembic.ini"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/windows-installed-acceptance.yml"
      - "packaging/windows/**"
      - "requirements/windows-build.lock"
      - "scripts/build_windows_ci.ps1"
      - "scripts/ensure_inno_setup.ps1"
      - "scripts/windows_build_provenance.py"
      - "scripts/windows_installed_acceptance.ps1"
      - "src/**"
      - "config/**"
      - "migrations/**"
      - "alembic.ini"
      - "pyproject.toml"

concurrency:
  group: windows-installed-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installed-acceptance:
    name: Install and exercise Setup.exe
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read controlled build manifest
        id: manifest
        shell: pwsh
        run: |
          $manifest = Get-Content packaging/windows/build-manifest.json -Raw | ConvertFrom-Json
          "python_version=$($manifest.python_version)" >> $env:GITHUB_OUTPUT
          "pip_version=$($manifest.pip_version)" >> $env:GITHUB_OUTPUT
          "inno_version=$($manifest.inno_setup_version)" >> $env:GITHUB_OUTPUT
          "python_hash_seed=$($manifest.python_hash_seed)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.manifest.outputs.python_version }}
          cache: pip
          cache-dependency-path: requirements/windows-build.lock

      - name: Set deterministic build environment
        shell: pwsh
        run: |
          $epoch = (& git show -s --format=%ct HEAD).Trim()
          if (-not $epoch) { throw "Cannot derive source commit timestamp" }
          "PYTHONHASHSEED=${{ steps.manifest.outputs.python_hash_seed }}" >> $env:GITHUB_ENV
          "SOURCE_DATE_EPOCH=$epoch" >> $env:GITHUB_ENV

      - name: Install exact Python build closure
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip==${{ steps.manifest.outputs.pip_version }}"
          python -m pip install --no-deps --only-binary=:all: -r requirements/windows-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Ensure exact Inno Setup compiler
        shell: pwsh
        run: ./scripts/ensure_inno_setup.ps1 -Version "${{ steps.manifest.outputs.inno_version }}"

      - name: Build controlled Windows installer
        shell: pwsh
        run: ./scripts/build_windows_ci.ps1

      - name: Exercise installed application
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "discount-parser-installed"
          $evidence = Join-Path $env:RUNNER_TEMP "dp-ci-002\installed-acceptance.json"
          ./scripts/windows_installed_acceptance.ps1 `
            -InstallerPath "delivery\DiscountParser-Setup.exe" `
            -InstallDir $installDir `
            -EvidenceOutput $evidence `
            -WebPort 18765

      - name: Upload installed-acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dp-ci-002-installed-windows
          path: |
            ${{ runner.temp }}/dp-ci-002/**
            delivery/windows-build-provenance.json
          if-no-files-found: warn
          retention-days: 14
