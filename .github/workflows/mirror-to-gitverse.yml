name: Mirror to GitVerse

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: mirror-to-gitverse
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate configuration
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        run: |
          set -euo pipefail
          test -n "$GITVERSE_TOKEN" || { echo "::error::GITVERSE_TOKEN is missing"; exit 1; }
          test -n "$GITVERSE_REPOSITORY" || { echo "::error::GITVERSE_REPO is missing"; exit 1; }

      - name: Clone canonical GitHub repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" \
            repository.git

      - name: Preflight GitVerse main lineage
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        run: |
          set -euo pipefail
          cd repository.git

          git remote add gitverse \
            "https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/arvectum/${GITVERSE_REPOSITORY}.git"

          if git ls-remote --exit-code --heads gitverse main >/dev/null 2>&1; then
            git fetch --no-tags gitverse \
              refs/heads/main:refs/remotes/gitverse/main

            if ! git merge-base --is-ancestor \
              refs/remotes/gitverse/main refs/heads/main; then
              echo "::error::GitVerse main is ahead of or diverged from canonical GitHub main. Refusing to mirror. Reconcile repository history first."
              echo "GitHub main: $(git rev-parse refs/heads/main)"
              echo "GitVerse main: $(git rev-parse refs/remotes/gitverse/main)"
              exit 1
            fi
          fi

      - name: Push branches and tags to GitVerse without deletion or force
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        run: |
          set -euo pipefail
          cd repository.git

          # GitVerse is a replica, not a source of canonical truth. Never prune
          # remote-only refs and never force-update existing refs: unique
          # recovery/release provenance must survive until explicit reconciliation.
          git push gitverse \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'

      - name: Summary
        if: success()
        env:
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        run: |
          echo "### GitVerse replica updated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical source: \`${GITHUB_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Replica target: \`arvectum/${GITVERSE_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: non-destructive (no force, no prune)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: \`${GITHUB_EVENT_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
