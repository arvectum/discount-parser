name: DP-REPO-002 Ref Matrix Evidence

on:
  push:
    branches:
      - recovery/dp-repo-002-import

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Emit reconciliation evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PRODUCT_HEAD: refs/heads/recovery/gitverse-main-ff8efb4-20260817
          LOST_WINDOWS_PREFIX: b6ba4e0
        run: |
          set -euo pipefail
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" repo.git
          cd repo.git
          product="$(git rev-parse "$PRODUCT_HEAD")"
          canonical="$(git rev-parse refs/heads/main)"
          merge_base="$(git merge-base "$canonical" "$product")"
          echo "DP_REPO_002_CANONICAL=$canonical"
          echo "DP_REPO_002_PRODUCT=$product"
          echo "DP_REPO_002_MERGE_BASE=$merge_base"
          echo "DP_REPO_002_PRODUCT_COMMITS_BEGIN"
          git log --reverse --format='%H|%s' "$merge_base..$product"
          echo "DP_REPO_002_PRODUCT_COMMITS_END"
          echo "DP_REPO_002_MATRIX_BEGIN"
          echo "ref|tip|relation|product_only|ref_only|patch_unique"
          while read -r ref; do
            case "$ref" in
              refs/heads/fix/*|refs/heads/hotfix/*|refs/heads/feature/*|refs/heads/recovery/*|refs/heads/reconcile/*|refs/tags/r12*|refs/tags/discount-parser-*) ;;
              *) continue ;;
            esac
            case "$ref" in
              refs/heads/recovery/dp-repo-002-import|refs/heads/recovery/gitverse-main-ff8efb4-20260817) continue ;;
            esac
            tip="$(git rev-parse "$ref^{commit}" 2>/dev/null || git rev-parse "$ref")"
            product_only="$(git rev-list --count "$tip..$product")"
            ref_only="$(git rev-list --count "$product..$tip")"
            if [ "$tip" = "$product" ]; then relation=equal;
            elif git merge-base --is-ancestor "$tip" "$product"; then relation=ancestor;
            elif git merge-base --is-ancestor "$product" "$tip"; then relation=descendant;
            else relation=diverged; fi
            patch_unique="$(git cherry "$product" "$tip" 2>/dev/null | grep -c '^+' || true)"
            echo "$ref|$tip|$relation|$product_only|$ref_only|$patch_unique"
          done < <(git for-each-ref --format='%(refname)' refs/heads refs/tags | sort)
          echo "DP_REPO_002_MATRIX_END"
          count="$(git rev-list --all | grep -c "^${LOST_WINDOWS_PREFIX}" || true)"
          echo "DP_REPO_002_B6_REACHABLE=$count"
          for ref in \
            refs/heads/fix/windows-installer-startup-recovery \
            refs/heads/release/windows-recovery-final-tested \
            refs/tags/discount-parser-telegram-hotfix-2026-08-15 \
            refs/tags/discount-parser-windows-recovery-hotfix-2026-08-16; do
            if git show-ref --verify --quiet "$ref"; then
              echo "DP_REPO_002_DELETED_REF|$ref|PRESENT|$(git rev-parse "$ref")"
            else
              echo "DP_REPO_002_DELETED_REF|$ref|ABSENT|-"
            fi
          done
